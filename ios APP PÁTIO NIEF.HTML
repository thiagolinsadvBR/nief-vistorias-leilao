    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* MODO ESCURO FIXO */
        :root { 
            --bg-color: #121212; 
            --text-color: #e0e0e0; 
            --card-bg: #1e1e1e; 
            --input-bg: #2b2b2b;
            --input-text: #ffffff;
            --border-color: #444;
        }
        
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); }
        
        .form-control, .form-select { 
            background-color: var(--input-bg); 
            color: var(--input-text); 
            border: 1px solid var(--border-color);
            margin-bottom: 10px; 
        }
        .form-control:focus, .form-select:focus {
            background-color: #333;
            color: #fff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .form-control::placeholder { color: #888; }

        .table { color: var(--text-color); border-color: var(--border-color); }
        .table-light { --bs-table-bg: #2b2b2b; --bs-table-color: #fff; }
        .table-bordered > :not(caption) > * > * { border-width: 0 1px; border-color: var(--border-color); }

        .btn-floating { position: fixed; bottom: 20px; right: 20px; z-index: 1000; border-radius: 50px; width: 60px; height: 60px; font-size: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        #exportBtn { position: fixed; bottom: 20px; left: 20px; z-index: 1000; border-radius: 50px; }
        
        .logo-container { display: flex; justify-content: center; margin-bottom: 20px; padding-top: 20px; }
        .logo-container img { max-width: 90%; height: auto; max-height: 150px; object-fit: contain; }

        h6.titulo-secao { color: #aaaaaa; border-bottom: 1px solid #444; padding-bottom: 5px; margin-top: 15px; }
        .label-destaque { color: #fff; font-weight: bold; margin-top: 10px; display: block; }
    </style>
</head>

    <h6 class="titulo-secao">Últimos Registros:</h6>
    <div class="table-responsive">

                <tr>
                    <th>Item</th>
                    <th>Placa</th>

<button class="btn btn-success btn-floating" onclick="adicionarVeiculo()">+</button>
<button id="exportBtn" class="btn btn-primary shadow" onclick="gerarPlanilha()">📥 Baixar Excel</button>
<button class="btn btn-danger btn-sm shadow" style="position: fixed; bottom: 20px; left: 160px; z-index: 1000;" onclick="limparTudo()">🗑️ Limpar</button>

<script>
    let dados = JSON.parse(localStorage.getItem('vistoriaDB')) || [];
    atualizarTabela();

    function adicionarVeiculo() {
        const item = {
            item: dados.length + 1,
            placa: document.getElementById('placa').value.toUpperCase() || "SEM PLACA",
            chassi: document.getElementById('chassi').value.toUpperCase(),
            motor: document.getElementById('motor').value.toUpperCase(),
            renavam: document.getElementById('renavam').value,
            marca: document.getElementById('marca').value.toUpperCase(),
            modelo: document.getElementById('modelo').value.toUpperCase(),
            anoFab: document.getElementById('anoFab').value,
            anoMod: document.getElementById('anoMod').value,
            multas: document.getElementById('multas').value,
            roubo: document.getElementById('roubo').value,
            restJud: document.getElementById('restJud').value,
            restAdm: document.getElementById('restAdm').value,
            placaMercosul: document.getElementById('placaMercosul').value,
            obs: document.getElementById('obs').value,
            proprietario: document.getElementById('proprietario').value.toUpperCase(),
            // VALORES FIXOS
            patio: "Pátio STTP",
            cidade: "Campina Grande",
            dataHora: new Date().toLocaleString()
        };

        if(!item.modelo) { alert("Preencha pelo menos o Modelo."); return; }

        dados.push(item);
        salvarDados();
        limparCamposVariaveis();
        atualizarTabela();
        window.scrollTo(0, 0);
        
        const badge = document.getElementById('contador');
        badge.classList.remove('bg-secondary');
        badge.classList.add('bg-success');
        setTimeout(() => {
            badge.classList.remove('bg-success');
            badge.classList.add('bg-secondary');
        }, 1000);
    }

    function salvarDados() {
        localStorage.setItem('vistoriaDB', JSON.stringify(dados));
    }

    function limparCamposVariaveis() {
        const ids = ['placa', 'renavam', 'chassi', 'motor', 'marca', 'modelo', 'anoFab', 'anoMod', 'proprietario', 'obs'];
        ids.forEach(id => document.getElementById(id).value = '');
        document.getElementById('placa').focus();
    }

    function atualizarTabela() {
        const tbody = document.getElementById('tabelaCorpo');
        tbody.innerHTML = '';
        document.getElementById('contador').innerText = dados.length;

        const ultimos = dados.slice(-5).reverse();

        ultimos.forEach((v) => {
            let row = `<tr>
                <td>${v.item}</td>
                <td>${v.placa}</td>
                <td>${v.marca}/${v.modelo}</td>
                <td><button class="btn btn-danger btn-sm" onclick="removerUltimo()">X</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function removerUltimo() {
        if(confirm("Remover o último registro?")) {
            dados.pop();
            salvarDados();
            atualizarTabela();
        }
    }

    function limparTudo() {
        if(confirm("ATENÇÃO: Isso apagará TODOS os dados coletados. Tem certeza?")) {
            dados = [];
            salvarDados();
            atualizarTabela();
        }
    }

    function gerarPlanilha() {
        if(dados.length === 0) { alert("Nenhum dado para exportar."); return; }

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Item;Placa;Chassi;Motor;Renavam;Marca;Modelo;Ano Fab;Ano Mod;Multas;Roubo;Rest. Jud;Rest. Adm;Placa Mercosul;Proprietario;Patio;Cidade;Observacoes\n";

        dados.forEach(row => {
            let rowStr = [
                row.item, row.placa, row.chassi, row.motor, row.renavam, 
                row.marca, row.modelo, row.anoFab, row.anoMod, 
                row.multas, row.roubo, row.restJud, row.restAdm, 
                row.placaMercosul, row.proprietario, row.patio, row.cidade, row.obs
            ].join(";");
            csvContent += rowStr + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "relatorio_leilao_" + new Date().toISOString().slice(0,10) + ".csv");
        document.body.appendChild(link);
        link.click();
    }
</script>

</body>
</html>
